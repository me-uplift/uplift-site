<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Tokens" subtitle="8px base scale — space-1 through space-11" viewport="700x175" -->
<html><head><meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@700,500,400&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'Satoshi'; src: url('../fonts/Satoshi-Regular.woff2') format('woff2'), url('../fonts/Satoshi-Regular.woff') format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Satoshi'; src: url('../fonts/Satoshi-Italic.woff2') format('woff2'), url('../fonts/Satoshi-Italic.woff') format('woff'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Satoshi'; src: url('../fonts/Satoshi-Medium.woff2') format('woff2'), url('../fonts/Satoshi-Medium.woff') format('woff'); font-weight: 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Satoshi'; src: url('../fonts/Satoshi-Medium.woff2') format('woff2'), url('../fonts/Satoshi-Medium.woff') format('woff'); font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Satoshi'; src: url('../fonts/Satoshi-Medium.woff2') format('woff2'), url('../fonts/Satoshi-Medium.woff') format('woff'); font-weight: 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('../fonts/InstrumentSerif-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; font-display: swap; }
</style>
  <style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #10101A; font-family: 'Satoshi', sans-serif; padding: 20px 24px; }
  .grid { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: linear-gradient(180deg, #9B70C0, #5E65B5); border-radius: 4px; width: 28px; }
  .val { font-size: 10px; color: #fff; font-weight: 700; }
  .var { font-size: 9px; color: #6B6B85; font-weight: 500; }
</style>
</head><body>
  <div class="grid">
    <div class="item"><div class="bar" style="height:4px"></div><div class="val">4</div><div class="var">--space-1</div></div>
    <div class="item"><div class="bar" style="height:8px"></div><div class="val">8</div><div class="var">--space-2</div></div>
    <div class="item"><div class="bar" style="height:12px"></div><div class="val">12</div><div class="var">--space-3</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="val">16</div><div class="var">--space-4</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="val">24</div><div class="var">--space-5</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="val">32</div><div class="var">--space-6</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="val">48</div><div class="var">--space-7</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="val">64</div><div class="var">--space-8</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="val">80</div><div class="var">--space-9</div></div>
    <div class="item"><div class="bar" style="height:96px"></div><div class="val">96</div><div class="var">--space-10</div></div>
    <div class="item"><div class="bar" style="height:112px"></div><div class="val">128</div><div class="var">--space-11</div></div>
  </div>
</body></html>
