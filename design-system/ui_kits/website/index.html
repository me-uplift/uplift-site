// ── Nav ─────────────────────────────────────────────────────
const Nav = ({ activePage, onNavigate }) => {
  const t = useTheme();
  const [scrolled, setScrolled] = React.useState(false);
  React.useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const links = ['Services','Work','Pricing','About'];
  return (
    <nav style={{
      position:'fixed', top:0, left:0, right:0, zIndex:100,
      padding:'0 48px', height:72,
      display:'flex', alignItems:'center', justifyContent:'space-between',
      background: scrolled ? t.navBg : 'transparent',
      backdropFilter: scrolled ? 'blur(16px)' : 'none',
      borderBottom: scrolled ? `1px solid ${t.borderNav}` : 'none',
      transition:'all 250ms cubic-bezier(0.4,0,0.2,1)',
    }}>
      <div style={{display:'flex',alignItems:'center',cursor:'pointer'}} onClick={() => onNavigate('home')}>
        <img src={t.logo} alt="Uplift" style={{height:30}} />
      </div>
      <div style={{display:'flex', gap:36, alignItems:'center'}}>
        {links.map(l => (

            background:'none', border:'none', cursor:'pointer',
            fontFamily:"'Satoshi',sans-serif", fontSize:13, fontWeight:500,
            letterSpacing:'0.1em', textTransform:'uppercase',

        onMouseLeave={e=>{e.currentTarget.style.opacity='1';e.currentTarget.style.transform='scale(1)';}}

    <footer style={{background:t.bgAlt,borderTop:`1px solid ${t.border}`,padding:'64px 48px 40px'}}>
      <div style={{maxWidth:1200,margin:'0 auto'}}>
        <div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr 1fr',gap:48,marginBottom:64}}>
          <div>
            <img src={t.logo} alt="Uplift" style={{height:26,marginBottom:20}}/>
            <p style={{fontFamily:"'Satoshi',sans-serif",fontSize:14,color:t.fg3,lineHeight:1.7,maxWidth:280,marginBottom:24}}>Social media management and UGC content for brands ready to grow.</p>
            <div style={{display:'flex',gap:10}}>
              {['IG','TK','LI','YT'].map(s=>(
                <div key={s} style={{width:36,height:36,borderRadius:10,background:t.surface,border:`1px solid ${t.border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                  <span style={{fontFamily:"'Satoshi',sans-serif",fontSize:10,fontWeight:700,color:t.fg3}}>{s}</span>
                </div>
              ))}
            </div>
          </div>
          {cols.map((col,i)=>(
            <div key={i}>
              <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:11,fontWeight:500,color:t.fg1,textTransform:'uppercase',letterSpacing:'0.12em',marginBottom:20}}>{col.title}</div>
              <div style={{display:'flex',flexDirection:'column',gap:12}}>
                {col.links.map(l=>(
                  <span key={l} style={{fontFamily:"'Satoshi',sans-serif",fontSize:14,color:t.fg3,cursor:'pointer'}}
                    onMouseEnter={e=>e.target.style.color=t.fg2}
                    onMouseLeave={e=>e.target.style.color=t.fg3}
                  >{l}</span>
                ))}
              </div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',borderTop:`1px solid ${t.border}`,paddingTop:24}}>
          <span style={{fontFamily:"'Satoshi',sans-serif",fontSize:12,color:t.fg4}}>© 2025 Uplift Digital Studio. All rights reserved.</span>
          <div style={{display:'flex',gap:24}}>
            {['Privacy','Terms'].map(l=>(
              <span key={l} style={{fontFamily:"'Satoshi',sans-serif",fontSize:12,color:t.fg4,cursor:'pointer'}}>{l}</span>
            ))}
          </div>
        </div>
      </div>
    </footer>
  );
};

// ── Work page ─────────────────────────────────────────────────
const WorkPage = ({ onNavigate }) => {
  const t = useTheme();
  const cases = [
    {brand:'Solana Skincare',result:'+600% followers',platform:'Instagram · TikTok',grad:'linear-gradient(135deg,#E8998A,#C97BAF)'},
    {brand:'Verve Apparel',result:'2.3M impressions/mo',platform:'Instagram · LinkedIn',grad:'linear-gradient(135deg,#C97BAF,#9B70C0)'},
    {brand:'Tierra Foods',result:'4.8× ROAS',platform:'TikTok · Meta Ads',grad:'linear-gradient(135deg,#9B70C0,#5E65B5)'},
    {brand:'Kalos Fitness',result:'18K new followers',platform:'TikTok · Instagram',grad:'linear-gradient(135deg,#7878C8,#5E65B5)'},
    {brand:'Aurore Jewelry',result:'+220% engagement',platform:'Pinterest · Instagram',grad:'linear-gradient(135deg,#E8998A,#9B70C0)'},
    {brand:'Vivero Coffee',result:'500K reach / month',platform:'TikTok · YouTube',grad:'linear-gradient(135deg,#C97BAF,#5E65B5)'},
  ];
  return (
    <div style={{paddingTop:72}}>
      <section style={{background:t.bg,padding:'80px 48px 96px'}}>
        <div style={{maxWidth:1200,margin:'0 auto'}}>
          <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:11,fontWeight:500,color:'#9B70C0',textTransform:'uppercase',letterSpacing:'0.15em',marginBottom:16}}>Our Work</div>
          <h1 style={{fontFamily:"'Satoshi',sans-serif",fontSize:52,fontWeight:900,color:t.fg1,letterSpacing:'-0.02em',marginBottom:56}}>Results worth talking about.</h1>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
            {cases.map((c,i)=>(
              <div key={i} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:16,overflow:'hidden',transition:'transform 250ms',cursor:'pointer',boxShadow:t.cardShadow}}
                onMouseEnter={e=>e.currentTarget.style.transform='translateY(-3px)'}
                onMouseLeave={e=>e.currentTarget.style.transform='translateY(0)'}>
                <div style={{height:140,background:c.grad,opacity:0.85}}/>
                <div style={{padding:20}}>
                  <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:15,fontWeight:700,color:t.fg1,marginBottom:6}}>{c.brand}</div>
                  <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:20,fontWeight:900,letterSpacing:'-0.02em',marginBottom:8,background:'linear-gradient(90deg,#E8998A,#9B70C0,#5E65B5)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>{c.result}</div>
                  <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:11,color:t.fg3,textTransform:'uppercase',letterSpacing:'0.1em',fontWeight:500}}>{c.platform}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
      <Testimonials/>
      <Footer onNavigate={onNavigate}/>
    </div>
  );
};

// ── App ──────────────────────────────────────────────────────
const App = () => {
  const saved = JSON.parse(localStorage.getItem('uplift_kit') || 'null') || TWEAK_DEFAULTS;
  const [themeName, setThemeName] = React.useState(saved.theme || 'light');
  const [page, setPage] = React.useState(saved.page || 'home');
  const [tweaksVisible, setTweaksVisible] = React.useState(false);

  const persist = (th, pg) => localStorage.setItem('uplift_kit', JSON.stringify({theme:th, page:pg}));

  const navigate = (p) => {
    setPage(p); persist(themeName, p);
    window.scrollTo({top:0,behavior:'instant'});
  };
  const toggleTheme = () => {
    const next = themeName === 'dark' ? 'light' : 'dark';
    setThemeName(next); persist(next, page);
    window.parent.postMessage({type:'__edit_mode_set_keys', edits:{theme:next}}, '*');
  };

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
  }, []);

  const t = THEMES[themeName];

  return (
    <ThemeCtx.Provider value={t}>
      <div style={{background:t.bg,minHeight:'100vh',transition:'background 300ms'}}>
        <Nav activePage={page} onNavigate={navigate}/>

        {page === 'home' && <>
          <Hero onNavigate={navigate}/>
          <Services/>
          <Testimonials/>
          <Pricing/>
          <Footer onNavigate={navigate}/>
        </>}
        {page === 'services' && <div style={{paddingTop:72}}>
          <section style={{background:t.bg,padding:'80px 48px 40px',borderBottom:`1px solid ${t.border}`}}>
            <div style={{maxWidth:1200,margin:'0 auto'}}>
              <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:11,fontWeight:500,color:'#9B70C0',textTransform:'uppercase',letterSpacing:'0.15em',marginBottom:16}}>Services</div>
              <h1 style={{fontFamily:"'Satoshi',sans-serif",fontSize:52,fontWeight:900,color:t.fg1,letterSpacing:'-0.02em',maxWidth:600}}>Everything your brand needs.</h1>
            </div>
          </section>
          <Services/><Footer onNavigate={navigate}/>
        </div>}
        {page === 'pricing' && <div style={{paddingTop:72}}><Pricing/><Footer onNavigate={navigate}/></div>}
        {page === 'work' && <WorkPage onNavigate={navigate}/>}
        {page === 'about' && <div style={{paddingTop:72}}>
          <section style={{background:t.bg,padding:'80px 48px 96px'}}>
            <div style={{maxWidth:1200,margin:'0 auto',display:'grid',gridTemplateColumns:'1fr 1fr',gap:80,alignItems:'center'}}>
              <div>
                <div style={{fontFamily:"'Satoshi',sans-serif",fontSize:11,fontWeight:500,color:'#9B70C0',textTransform:'uppercase',letterSpacing:'0.15em',marginBottom:20}}>About</div>
                <h1 style={{fontFamily:"'Satoshi',sans-serif",fontSize:52,fontWeight:900,color:t.fg1,lineHeight:1.1,letterSpacing:'-0.02em',marginBottom:28}}>We build social media that works while you sleep.</h1>
                <p style={{fontFamily:"'Satoshi',sans-serif",fontSize:16,color:t.fg3,lineHeight:1.8,marginBottom:20}}>Uplift Digital Studio is a social media management and UGC agency for premium brands. We handle strategy, creation, community, and reporting — so you can focus on your business.</p>
                <p style={{fontFamily:"'Satoshi',sans-serif",fontSize:16,color:t.fg3,lineHeight:1.8,marginBottom:36}}>We work in English and Spanish, and we bring the same standard to both.</p>
                <button onClick={()=>navigate('pricing')} style={{fontFamily:"'Satoshi',sans-serif",fontWeight:700,fontSize:15,color:'#fff',background:'linear-gradient(90deg,#E8998A,#C97BAF,#9B70C0,#5E65B5)',border:'none',cursor:'pointer',borderRadius:999,padding:'14px 32px'}}>See pricing</button>
              </div>
              <div style={{height:420,borderRadius:24,background:`linear-gradient(135deg,${t.surface},${t.raised})`,border:`1px solid ${t.border}`,display:'flex',alignItems:'center',justifyContent:'center',position:'relative',overflow:'hidden',boxShadow:t.cardShadow}}>
                <div style={{position:'absolute',inset:0,background:'radial-gradient(ellipse at 60% 40%, rgba(155,112,192,0.15) 0%, transparent 65%)'}}/>
                <img src="../../assets/UpliftLogo_GradientIcon.svg" style={{width:120,opacity:0.9,position:'relative',zIndex:1}}/>
              </div>
            </div>
          </section>
          <Footer onNavigate={navigate}/>
        </div>}

        {/* Tweaks panel */}
        <div className={`tweaks-panel${tweaksVisible?' visible':''}`}>
          <div className="tweaks-title">Tweaks</div>
          <div className="tweak-row">
            <span className="tweak-label">{themeName === 'dark' ? 'Dark mode' : 'Light mode'}</span>
            <button className="toggle" style={{background:themeName==='dark'?'linear-gradient(90deg,#9B70C0,#5E65B5)':'#D0CDE8'}} onClick={toggleTheme}>
              <div className="toggle-knob" style={{left:themeName==='dark'?24:4}}/>
            </button>
          </div>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
